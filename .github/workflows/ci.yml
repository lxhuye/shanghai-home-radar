name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: shanghai_home_radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d shanghai_home_radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SHR_ENVIRONMENT: test
      SHR_DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/shanghai_home_radar_test
      SHR_TEST_DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/shanghai_home_radar_test
      SHR_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Check migration drift
        run: alembic check
      - name: Lint backend
        run: ruff check .
      - name: Check backend formatting
        run: ruff format --check .
      - name: Type-check backend
        run: mypy
      - name: Run backend tests
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Type-check web
        run: npm run typecheck
      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
