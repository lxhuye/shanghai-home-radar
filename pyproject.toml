[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shanghai-home-radar"
version = "0.1.0"
description = "Private, explainable monitoring and evaluation for Shanghai resale homes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.16,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<4",
  "pyyaml>=6.0,<7",
  "redis>=5.2,<6",
  "rq>=2.1,<3",
  "sqlalchemy>=2.0.36,<3",
  "tenacity>=9.0,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6.0,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
home-radar-collect = "home_radar_collector.cli:main"
home-radar-enqueue = "home_radar_collector.enqueue:main"
home-radar-seed = "home_radar_collector.seed:main"
home-radar-market-enqueue = "home_radar_market.cli:enqueue_main"
home-radar-market-schedule = "home_radar_market.cli:schedule_main"
home-radar-market-demo-seed = "home_radar_market.demo_seed:main"
home-radar-valuation-enqueue = "home_radar_valuation.cli:enqueue_main"
home-radar-future-enqueue = "home_radar_forecasting.cli:enqueue_main"
home-radar-decision-enqueue = "home_radar_decision.cli:enqueue_main"

[tool.setuptools.packages.find]
where = [
  "services/api/src",
  "services/collector/src",
  "services/valuation/src",
  "services/forecasting/src",
  "services/decision/src",
  "services/notification/src",
  "services/scoring/src",
  "services/market/src",
  "services/browser_agent/src",
  "packages/models/src",
  "packages/shared/src",
  "scripts/build_district_factor_evidence.py",
]
include = ["home_radar_*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests", "services/collector/tests"]
asyncio_mode = "auto"
markers = ["integration: requires an isolated PostgreSQL database"]
pythonpath = [
  ".",
  "services/api/src",
  "services/collector/src",
  "services/valuation/src",
  "services/forecasting/src",
  "services/decision/src",
  "services/notification/src",
  "services/scoring/src",
  "services/market/src",
  "packages/models/src",
  "packages/shared/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/api/src:services/collector/src:services/valuation/src:services/forecasting/src:services/decision/src:services/notification/src:services/scoring/src:services/market/src:packages/models/src:packages/shared/src"
files = [
  "services/api/src",
  "services/collector/src",
  "services/valuation/src",
  "services/forecasting/src",
  "services/decision/src",
  "services/notification/src",
  "services/scoring/src",
  "services/market/src",
  "packages/models/src",
  "packages/shared/src",
  "scripts/build_transport_evidence.py",
  "scripts/daily_scheduler.py",
  "scripts/daily_update_pipeline.py",
  "scripts/geocode_listings.py",
  "scripts/import_future_evidence.py",
  "scripts/mock_authorized_api.py",
  "scripts/p57_set_a.py",
  "scripts/prepare_partner_csv_manifest.py",
  "scripts/release_fingerprint.py",
]
