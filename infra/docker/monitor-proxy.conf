map $http_origin $handoff_origin_allowed {
    default 0;
    "" 1;
    "http://127.0.0.1:7900" 1;
    "http://localhost:7900" 1;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 2m;
    location / {
        proxy_pass http://monitor:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# WebSocket origin checks prevent an unrelated website controlling the local VNC.
server {
    listen 7900;
    server_name localhost;
    resolver 127.0.0.11 valid=30s;
    set $browser_backend http://browser:7900;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    location / {
        if ($handoff_origin_allowed = 0) { return 403; }
        proxy_pass $browser_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
